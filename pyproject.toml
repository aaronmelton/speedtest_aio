[project]
name = "speedtest_aio"
version = "0.9.0"
description = "A Python script to capture speedtest JSON and insert it into a database."
authors = [
    { name = "Aaron Melton", email = "aaron@aaronmelton.com" },
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "speedtest-cli>=2.1.3,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "D", "UP", "C4", "SIM"]
ignore = ["E501", "S108", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
mypy_path = "speedtest_aio"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "speedtest_aio"]
env = ["LOG_LEVEL = DEBUG",
       "LOG_PATH = /tmp/"]

[tool.coverage.run]
source = ["speedtest_aio"]
